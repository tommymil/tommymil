# Kompresja tekstu. Bundle aplikacji to ok. 630 kB, po gzipie ok. 175 kB - różnica, którą
# rodzic na telefonie odczuwa wprost. Obrazów i plików projektów nie kompresujemy: są już
# skompresowane, a ponowna próba tylko zjada procesor.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/calendar
  application/javascript
  application/json
  image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nie ogłaszamy wersji nginxa w nagłówku Server ani na stronach błędów.
  server_tokens off;

  # Limit spójny z FileUploadRules.MaxSizeBytes (10 MB) - bez tego nginx odrzuciłby
  # upload wcześniej niż backend, własnym błędem 413.
  client_max_body_size 12m;

  # --- Nagłówki bezpieczeństwa ---
  #
  # Token JWT leży w localStorage, więc dowolny XSS oznacza przejęcie konta na 12 godzin.
  # CSP jest tu drugą linią obrony - pierwszą jest React, który sam escapuje tekst
  # (w kodzie nie ma ani jednego `dangerouslySetInnerHTML`).
  #
  # `style-src` z 'unsafe-inline' jest konieczne: React ustawia atrybuty `style` na elementach.
  # `script-src` celowo NIE ma tej furtki - build Vite emituje wyłącznie zewnętrzne moduły.
  # `connect-src 'self'` wystarcza, bo nginx proxuje /api do backendu (ten sam origin).
  # Gdy API stoi pod inną domeną (VITE_API_BASE_URL), trzeba ją tu dopisać - inaczej
  # przeglądarka zablokuje wszystkie żądania do API.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Klikanie w cudzej ramce - portal rodzica i panel nie mają powodu być osadzane.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Adresy zawierają identyfikatory dzieci i terminów, więc nie wysyłamy ich na obce strony.
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /download/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Zasoby budowane przez Vite mają skrót treści w nazwie pliku, więc nowa wersja to nowy
  # adres. Można je trzymać w cache długo - to jedyny sposób, żeby powrót do aplikacji
  # nie pobierał całego bundla od nowa.
  #
  # Sterujemy tym dyrektywą `expires`, a nie `add_header Cache-Control`, świadomie: **jeden**
  # `add_header` w bloku `location` odcina dziedziczenie **wszystkich** nagłówków z bloku
  # `server`. Trzeba by je tu przepisać, a przepisana lista prędzej czy później rozjedzie się
  # z oryginałem - i nagłówki bezpieczeństwa zniknęłyby po cichu.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    # `index.html` wskazuje na aktualne skróty zasobów, więc nie wolno go cache'ować -
    # inaczej przeglądarka po wdrożeniu prosiłaby o pliki, których już nie ma.
    # `expires -1` to `Cache-Control: no-cache`.
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
